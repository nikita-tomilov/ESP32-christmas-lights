<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="./style.css" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1">
     </head>
    <body>
         <div id="loader"></div>
          <div id="wrapper">
               <h2 id='header'> Fairy lights settings </h2>
               <div id='navigatonWrapper'>
                    <h4>Navigate to: </h3>
                    <div id='navigate'></div>
               </div>
          <div class="controlsWrapper"> 
               <h4> Brightness mode: </h4>
               <select id="brightnessMode"></select>
          </div>
          <div class="controlsWrapper"> 
               <h4> Brightness: </h4>
               <div id="brightnessWrapper"></div>
          </div>
          <div class="controlsWrapper">
               <h4> Color mode: </h4>
               <select id="colorMode"></select>
          </div>
          <div class="controlsWrapper">
               <h4> Colors: </h4>
               <div id="colorPicker"></div> 
          </div>
          <div class="controlsWrapper"> 
                <h4> Slow Animation delay: </h4>
                <div id="slowAnimationDelayWrapper"></div>
          </div>
          <div class="controlsWrapper"> 
               <h4> Fast Animation delay: </h4>
               <div id="fastAnimationDelayWrapper"></div>
          </div>


          <div class="controlsWrapper"> 
               <h4>Input gain: </h4>
               <div id="inputGainWrapper"></div>
          </div>

          <div class="controlsWrapper"> 
               <h4> Cutoff: </h4>
               <div id="cutoffWrapper">  </div>
          </div>

           <button id="submit" >Save</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
